name: Generate car content

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat ID
        required: false
        type: string
  repository_dispatch:
    types: [cars_today]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TARGET_CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Generate 2 car packages
        run: python main.py
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-content-${{ github.run_number }}
          path: work/
          retention-days: 7
